<svg viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00fff0;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#18f0cc;stop-opacity:0.04" />
    </linearGradient>
    <radialGradient id="grad2" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#00fff0;stop-opacity:0.02" />
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" />
    </filter>
  </defs>

  <!-- Base layers -->
  <rect width="1200" height="1200" fill="url(#grad2)" />
  <rect width="1200" height="1200" fill="url(#grad1)" />

  <!-- Geometric shapes - Top left -->
  <circle cx="150" cy="200" r="120" fill="none" stroke="#00fff0" stroke-width="2" opacity="0.12" />
  <circle cx="150" cy="200" r="80" fill="none" stroke="#18f0cc" stroke-width="1.5" opacity="0.08" />
  
  <!-- Geometric shapes - Top right -->
  <path d="M 1050 50 L 1150 150 L 1050 250 L 950 150 Z" fill="none" stroke="#00fff0" stroke-width="2" opacity="0.1" />
  <path d="M 1070 70 L 1130 130 L 1070 190 L 1010 130 Z" fill="none" stroke="#18f0cc" stroke-width="1" opacity="0.08" />

  <!-- Diagonal lines pattern -->
  <g opacity="0.06" stroke="#00fff0" stroke-width="1.5">
    <line x1="0" y1="0" x2="1200" y2="1200" />
    <line x1="100" y1="0" x2="1200" y2="1100" />
    <line x1="200" y1="0" x2="1200" y2="1000" />
    <line x1="300" y1="0" x2="1200" y2="900" />
    <line x1="0" y1="100" x2="1100" y2="1200" />
    <line x1="0" y1="200" x2="1000" y2="1200" />
  </g>

  <!-- Hexagon pattern - Bottom left -->
  <g opacity="0.08" fill="none" stroke="#18f0cc" stroke-width="1.5">
    <polygon points="100,850 150,820 200,850 200,920 150,950 100,920" />
    <polygon points="220,850 270,820 320,850 320,920 270,950 220,920" />
    <polygon points="340,850 390,820 440,850 440,920 390,950 340,920" />
    <polygon points="100,1000 150,970 200,1000 200,1070 150,1100 100,1070" />
    <polygon points="220,1000 270,970 320,1000 320,1070 270,1100 220,1070" />
  </g>

  <!-- Circles pattern - Bottom right -->
  <g opacity="0.08" fill="none" stroke="#00fff0" stroke-width="1.5">
    <circle cx="1000" cy="950" r="40" />
    <circle cx="1000" cy="950" r="60" />
    <circle cx="1100" cy="1050" r="50" />
    <circle cx="1100" cy="1050" r="70" />
  </g>

  <!-- Central accent shapes -->
  <g opacity="0.05" filter="url(#blur)">
    <rect x="450" y="450" width="300" height="300" fill="none" stroke="#00fff0" stroke-width="2" transform="rotate(45 600 600)" />
    <circle cx="600" cy="600" r="150" fill="none" stroke="#18f0cc" stroke-width="1.5" />
  </g>

  <!-- Top middle accent -->
  <path d="M 600 0 Q 650 100 600 200 Q 550 100 600 0" fill="none" stroke="#00fff0" stroke-width="1.5" opacity="0.1" />
  
  <!-- Right side accent -->
  <path d="M 1200 300 Q 1100 350 1000 300 Q 1100 250 1200 300" fill="none" stroke="#18f0cc" stroke-width="1.5" opacity="0.1" />

  <!-- Small dot pattern -->
  <g fill="#00fff0" opacity="0.08">
    <circle cx="300" cy="400" r="2" />
    <circle cx="400" cy="500" r="2" />
    <circle cx="500" cy="350" r="2" />
    <circle cx="750" cy="300" r="2" />
    <circle cx="900" cy="450" r="2" />
    <circle cx="950" cy="700" r="2" />
    <circle cx="800" cy="800" r="2" />
    <circle cx="600" cy="1050" r="2" />
    <circle cx="350" cy="1100" r="2" />
  </g>
</svg>